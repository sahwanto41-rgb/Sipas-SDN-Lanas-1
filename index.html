<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIPAS LANAS 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#edf1f6;--c:#fff;--t:#14233a;--m:#5d6b80;--p:#0f2a47;--b:#d5dde8;--ac:#e8741e;--bl:#1b6ec2;--ok:#16794c;--wr:#b45309;--er:#b91c1c;--fh:'Zilla Slab',Rockwell,'Courier New',serif;--air:repeating-linear-gradient(-45deg,#e8741e 0 12px,#fff 12px 24px,#1b6ec2 24px 36px,#fff 36px 48px);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1522;--c:#12202f;--t:#e8eef6;--m:#93a3b8;--p:#2f6db3;--b:#22344a}}
:root[data-theme=dark]{--bg:#0b1522;--c:#12202f;--t:#e8eef6;--m:#93a3b8;--p:#2f6db3;--b:#22344a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font:14px/1.5 'Plus Jakarta Sans',system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--t)}
header{background:#0f2a47;color:#fff;padding:10px 20px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--air)}
header .lg-s{height:40px;width:40px;object-fit:contain;background:#fff;border-radius:6px;padding:3px}
.brand b{font:700 19px var(--fh);letter-spacing:.03em;display:block}.brand small,.who small{display:block;opacity:.72;font-size:11.5px}
header .sp{flex:1}.who{display:flex;align-items:center;gap:9px;text-align:right}.who b{font-size:13px;display:block}
.av{width:34px;height:34px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font:700 16px var(--fh)}
header button{background:transparent;border:1px solid rgba(255,255,255,.35)}header button:hover{background:rgba(255,255,255,.14)}
#app{display:flex;min-height:calc(100vh - 68px)}
nav{width:216px;padding:16px 10px;flex-shrink:0;position:sticky;top:72px;align-self:flex-start}
nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;margin-bottom:3px;border-radius:6px;cursor:pointer;color:var(--t);font-weight:500}
nav a::before{content:"•";width:24px;height:24px;display:grid;place-items:center;border-radius:5px;background:var(--b);font-size:13px;flex-shrink:0}
nav a:hover{background:var(--b)}nav a.on{background:var(--p);color:#fff}nav a.on::before{background:var(--ac);color:#fff}
nav a[data-p=dash]::before{content:"◧"}nav a[data-p=masuk]::before{content:"↙"}nav a[data-p=keluar]::before{content:"↗"}nav a[data-p=disp]::before{content:"⇄"}nav a[data-p=arsip]::before{content:"▤"}nav a[data-p=lap]::before{content:"≣"}nav a[data-p=data]::before{content:"⇅"}nav a[data-p=pengaturan]::before{content:"⚙"}nav a[data-p=panduan]::before{content:"?"}
main{flex:1;padding:22px 26px 40px;min-width:0;max-width:1240px}
h2{font:700 27px var(--fh);margin:0 0 16px}h2::after{content:"";display:block;width:46px;height:4px;background:var(--ac);margin-top:6px}
@media(max-width:760px){#app{flex-direction:column}nav{width:100%;position:static;display:flex;overflow-x:auto;padding:8px;gap:6px;border-bottom:1px solid var(--b)}nav a{white-space:nowrap;margin:0}main{padding:16px 14px 30px}header .sub,.who div{display:none}}
.card{background:var(--c);border:1px solid var(--b);border-radius:6px;padding:16px;margin-bottom:16px;box-shadow:3px 3px 0 var(--b)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.stat{outline:2px dashed var(--ac);outline-offset:-8px;padding:22px!important}
.stat b{font:700 42px/1 var(--fh);display:block;color:var(--p)}.stat span{color:var(--m);font-weight:600}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{padding:9px 10px;border-bottom:1px solid var(--b);text-align:left;vertical-align:top}
th{white-space:nowrap;font-weight:700;color:var(--m);border-bottom:2px solid var(--p)}tr:hover td{background:rgba(232,116,30,.07)}
label{display:block;margin:10px 0 4px;color:var(--m);font-size:12px;font-weight:600}
button,.btn{background:var(--p);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font:600 13px 'Plus Jakarta Sans',system-ui,sans-serif}
button:hover,.btn:hover{filter:brightness(1.15)}button:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.s,.btn.s{background:var(--b);color:var(--t)}button.d{background:var(--er)}button.x{padding:4px 9px;font-size:12px;margin:1px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--b);border-radius:6px;background:var(--c);color:var(--t);font:inherit}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--bl);box-shadow:0 0 0 3px rgba(27,110,194,.2)}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.bar input,.bar select{width:auto;flex:1;min-width:120px}
.tag{display:inline-block;padding:1px 7px;border:1.5px solid currentColor;border-radius:3px;color:var(--m);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;transform:rotate(-2deg)}
.tag[data-s=baru],.tag[data-s=rahasia],.tag[data-s=segera]{color:var(--ac)}.tag[data-s=didisposisikan],.tag[data-s=diperiksa],.tag[data-s=penting]{color:var(--wr)}
.tag[data-s=diproses],.tag[data-s=disetujui]{color:var(--bl)}.tag[data-s=ditandatangani]{color:#6d3fb0}.tag[data-s=selesai],.tag[data-s=terkirim]{color:var(--ok)}
#mod{position:fixed;inset:0;background:rgba(8,16,30,.62);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px;z-index:20}
#mod>div{background:var(--c);border-radius:8px;border-top:6px solid var(--ac);padding:18px;width:100%;max-width:560px}
#toast{position:fixed;bottom:18px;right:18px;background:#0f2a47;color:#fff;padding:11px 16px;border-radius:6px;border-left:4px solid var(--ac);display:none;z-index:30}
.ch{display:flex;align-items:flex-end;gap:6px;height:130px}.ch div{flex:1;text-align:center;font-size:11px;color:var(--m)}.ch i{display:block;background:var(--p);min-height:2px;border-radius:2px 2px 0 0}.ch i.k{background:var(--ac)}
.login{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.lb{background:#0f2a47;color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:center;gap:22px;position:relative;overflow:hidden}
.lb::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:var(--air)}
.lb img{height:76px;width:76px;object-fit:contain;background:#fff;border-radius:10px;padding:6px}
.lb h1{font:700 48px/1 var(--fh);margin:0;letter-spacing:.02em}.lb p{margin:0;opacity:.82;max-width:420px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chips span{border:1px solid rgba(255,255,255,.3);border-radius:3px;padding:3px 10px;font-size:12px}
.pmk{display:flex;align-items:center;gap:10px;opacity:.6;transform:rotate(-8deg);color:#f6a35f}
.pmk i{width:98px;height:98px;border:3px double currentColor;border-radius:50%;display:grid;place-items:center;font:700 12px/1.25 var(--fh);letter-spacing:.12em;text-align:center;font-style:normal}
.pmk u{width:120px;height:30px;background:repeating-linear-gradient(0deg,currentColor 0 3px,transparent 3px 9px)}
.lf{display:grid;place-items:center;padding:28px}
.lc{width:100%;max-width:400px;background:var(--c);border:1px solid var(--b);border-radius:6px;padding:32px 28px 26px;position:relative;box-shadow:5px 5px 0 var(--b)}
.lc::before{content:"";position:absolute;left:0;right:0;top:0;height:9px;background:var(--air)}
.lc p{margin-top:0}.lc button{width:100%;padding:11px;font-size:14px;margin-top:6px}
@media(max-width:820px){.login{grid-template-columns:1fr}.lb{padding:28px 22px}.lb h1{font-size:34px}.pmk,.chips{display:none}}
#pa{display:none}
#pa th,#mod th{color:#000;font-size:inherit;border-bottom:1px solid #888;background:#eee}#pa td,#mod td{border-bottom:1px solid #bbb;color:#000}#pa tr:hover td,#mod tr:hover td{background:none}
@media print{body>*:not(#pa){display:none!important}#pa{display:block;color:#000;background:#fff;padding:20px}#pa table{font-size:12px}}
</style></head><body>
<div id="root"></div><div id="mod"></div><div id="toast"></div><div id="pa"></div>
<script>
const $=s=>document.querySelector(s),H=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const ROLE={admin:'Administrator',kepsek:'Kepala Sekolah',operator:'Petugas TU/Operator',guru:'Guru/Staf'};
const KEY='sipas_lanas1_db';let db,me=null,page='dash';
const def=()=>({set:{sekolah:'UPTD SPF SD Negeri Lanas 1',kec:'Botolinggo',kab:'Bondowoso',alamat:'Jalan Guce Desa Lanas, Kec. Botolinggo, Bondowoso, Jawa Timur 68284',kepsek:'Sahwanto, S.Pd.',nip:'198111142008011012',tahun:new Date().getFullYear(),unit:'430.9.9.2.484',email:'sdnlanas01bot@gmail.com',fmt:'{kode}/{no}/{unit}/{thn}'},users:[],masuk:[],keluar:[],log:[]});
function load(){try{db=JSON.parse(localStorage.getItem(KEY))||def()}catch(e){db=def()}if(!db.set.adminSeed){const H0='bbad10e17b97a8ad77128494b6c98300a3ba0cfa2391d4a2231c12e50476b525',a=db.users.find(x=>x.user==='admin');if(a){a.h=H0;a.role='admin'}else db.users.push({id:uid(),nama:'Administrator',user:'admin',role:'admin',h:H0});db.set.adminSeed=1;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}if(db.set.tempat===undefined)db.set.tempat=db.set.kec;if(!db.set.gsSeed){db.set.sheetUrl='https://script.google.com/macros/s/AKfycbwpVGyLK7lLftYCr_DeFSn2Hncz0kG4DyuvTgZGExnmJshgz2WCQeVHpmo0S2ENSSC8Eg/exec';db.set.sheetToken='Lanas01@2023';db.set.gsSeed=1;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}if(!db.set.sheetToken)db.set.sheetToken=[...crypto.getRandomValues(new Uint8Array(24))].map(x=>x.toString(16).padStart(2,'0')).join('');if(!db.set.unit){const d=def().set;Object.assign(db.set,{unit:d.unit,email:d.email,fmt:d.fmt});['alamat','kepsek','nip'].forEach(k=>{if(!db.set[k])db.set[k]=d[k]})}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));schedSync();return true}catch(e){toast('Penyimpanan penuh! Ekspor cadangan & kurangi ukuran lampiran.');return false}}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}
function log(a){db.log.unshift({t:new Date().toLocaleString('id-ID'),u:me?me.nama:'-',a});db.log=db.log.slice(0,500)}
async function hash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sipas:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10);
const fd=d=>d?new Date(d).toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'}):'-';
const uname=id=>(db.users.find(u=>u.id===id)||{}).nama||'-';
const can=r=>r.includes(me.role);

// ---------- login ----------
function login(){
 const first=!db.users.length,k=`onkeydown="if(event.key==='Enter')doLogin(${first})"`;
 $('#root').innerHTML=`<div class="login"><section class="lb"><img src="${LOGO}" alt=""><h1>SIPAS<br>LANAS 1</h1><p>Sistem Informasi Persuratan &amp; Arsip Sekolah<br><b>${H(db.set.sekolah)}</b><br>Kec. ${H(db.set.kec)}, Kab. ${H(db.set.kab)}</p><div class="chips"><span>Surat Masuk</span><span>Surat Keluar</span><span>Disposisi</span><span>Arsip Digital</span></div><div class="pmk"><i>${H(db.set.kab).toUpperCase()}<br>${db.set.tahun}</i><u></u></div></section>
 <section class="lf"><div class="lc"><h2>${first?'Buat akun administrator':'Masuk'}</h2><p style="color:var(--m)">${first?'Akun ini mengelola seluruh pengguna dan pengaturan.':'Kelola surat masuk, surat keluar, dan arsip sekolah.'}</p>
 ${first?'<label>Nama lengkap</label><input id="ln">':''}
 <label>Username</label><input id="lu" autocomplete="username" ${k}><label>Kata sandi ${first?'(min. 8 karakter)':''}</label><input id="lp" type="password" autocomplete="current-password" ${k}><p><button onclick="doLogin(${first})">${first?'Buat akun dan masuk':'Masuk'}</button></p><small id="le" style="color:var(--er)"></small></div></section></div>`;
}
async function doLogin(first){
 const u=$('#lu').value.trim(),p=$('#lp').value,e=$('#le');
 if(!(window.crypto&&crypto.subtle)){e.textContent='Buka file ini langsung dari komputer/HP (bukan lewat http biasa), atau gunakan https.';return}
 if(!u||!p){e.textContent='Lengkapi username dan kata sandi.';return}
 if(first){if(p.length<8){e.textContent='Kata sandi minimal 8 karakter.';return}
  db.users.push({id:uid(),nama:$('#ln').value.trim()||u,user:u,role:'admin',h:await hash(p)});me=db.users[0];log('Membuat akun administrator');save()}
 else{
  const h=await hash(p);const f=db.users.find(x=>x.user===u&&x.h===h);
  if(!f){e.textContent='Username atau kata sandi salah.';return}me=f;log('Login')}
 sessionStorage.setItem('sipas_me',me.id);save();shell();
}
function logout(){log('Logout');save();me=null;sessionStorage.removeItem('sipas_me');login()}

// ---------- shell ----------
const MENU=[['dash','Dashboard',['admin','kepsek','operator','guru']],['masuk','Surat Masuk',['admin','kepsek','operator']],['keluar','Surat Keluar',['admin','kepsek','operator']],['disp','Disposisi',['admin','kepsek','operator','guru']],['arsip','Arsip Digital',['admin','kepsek','operator']],['lap','Laporan',['admin','kepsek','operator']],['data','Impor/Ekspor',['admin','kepsek','operator']],['pengaturan','Pengaturan',['admin']],['panduan','Panduan',['admin','kepsek','operator','guru']]];
function shell(){
 $('#root').innerHTML=`<header><img class="lg-s" src="${LOGO}" alt=""><div class="brand"><b>SIPAS LANAS 1</b><small class="sub">${H(db.set.sekolah)}, Kec. ${H(db.set.kec)}, ${H(db.set.kab)}</small></div><span class="sp"></span><div class="who"><div><b>${H(me.nama)}</b><small>${ROLE[me.role]}</small></div><span class="av">${H(me.nama.charAt(0).toUpperCase())}</span></div><button class="s" onclick="logout()">Keluar</button></header>
 <div id="app"><nav>${MENU.filter(m=>can(m[2])).map(m=>`<a data-p="${m[0]}" onclick="go('${m[0]}')">${m[1]}</a>`).join('')}</nav><main id="main"></main></div>`;
 go(page);
}
function go(p){if(!can(MENU.find(m=>m[0]===p)[2]))p='dash';page=p;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.p===p));$('#main').innerHTML='';VIEW[p]()}
const M=h=>{$('#main').innerHTML=h;document.querySelectorAll('#main .tag').forEach(t=>t.dataset.s=t.textContent.trim().toLowerCase())};

// ---------- modal & form ----------
function modal(h,w){const m=$('#mod');m.innerHTML='<div'+(w?' style="max-width:'+w+'px"':'')+'>'+h+'</div>';m.style.display='flex'}
function closeM(){$('#mod').style.display='none'}
function form(title,fields,v,ok){
 window._ok=ok;window._f=fields;
 modal(`<h3 style="margin-top:0">${title}</h3>${fields.map(f=>{const val=v[f.k]??f.d??'';let i;
  if(f.t==='select')i=`<select id="f_${f.k}">${f.o.map(o=>{const[a,b]=Array.isArray(o)?o:[o,o];return`<option value="${H(a)}" ${a==val?'selected':''}>${H(b)}</option>`}).join('')}</select>`;
  else if(f.t==='kode')i=`<input id="f_${f.k}" list="dl" value="${H(val)}" autocomplete="off"><datalist id="dl">${KODE.map(k=>`<option value="${k[0]}">${H(k[1])}</option>`).join('')}</datalist>`;
  else if(f.t==='textarea')i=`<textarea id="f_${f.k}" rows="3">${H(val)}</textarea>`;
  else if(f.t==='file')i=`<input id="f_${f.k}" type="file" accept=".pdf,image/*">${v[f.k]?'<small>Lampiran saat ini: '+H(v[f.k].name)+'</small>':''}`;
  else i=`<input id="f_${f.k}" type="${f.t||'text'}" value="${H(val)}">`;
  return`<label>${f.l}${f.r?' *':''}</label>${i}`}).join('')}
 <p><button onclick="subForm()">Simpan</button> <button class="s" onclick="closeM()">Batal</button></p>`);
}
async function subForm(){
 const o={};
 for(const f of window._f){const e=$('#f_'+f.k);
  if(f.t==='file'){const fl=e.files[0];if(fl){if(fl.size>700000){toast('Lampiran maks. 700 KB');return}
   o[f.k]=await new Promise(r=>{const x=new FileReader();x.onload=()=>r({name:fl.name,data:x.result});x.readAsDataURL(fl)})}}
  else{o[f.k]=e.value.trim();if(f.r&&!o[f.k]){toast('Kolom "'+f.l+'" wajib diisi');return}}}
 if(window._ok(o)!==false)closeM();
}
function conf(msg,fn){window._c=fn;modal(`<p>${msg}</p><button class="d" onclick="closeM();_c()">Ya, lanjutkan</button> <button class="s" onclick="closeM()">Batal</button>`)}
function preview(t,id){const it=db[t].find(x=>x.id===id);if(!it||!it.file)return;const d=it.file.data;if(!d){toast('File lampiran tidak tersimpan di perangkat ini (hanya nama berkas yang dipulihkan dari Sheet)');return}
 modal(`<b>${H(it.file.name)}</b> <a class="btn" href="${d}" download="${H(it.file.name)}">Unduh</a> <button class="s" onclick="closeM()">Tutup</button><div style="margin-top:10px">${d.startsWith('data:image')?`<img src="${d}" style="max-width:100%">`:`<iframe src="${d}" style="width:100%;height:65vh;border:0"></iframe>`}</div>`)}
let _ph='',_pn='';
function prn(html,nm){_ph=html;_pn=(nm||'dokumen-sipas').replace(/[^\w.-]+/g,'-');modal('<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px"><button onclick="doPrint()">Cetak</button><button class="s" onclick="dlDoc()">Unduh Word (.doc)</button><button class="s" onclick="closeM()">Tutup</button></div><div style="background:#fff;color:#000;padding:16px;border:1px solid var(--b);overflow:auto">'+html+'</div>',820)}
function doPrint(){$('#pa').innerHTML=_ph;try{window.print()}catch(e){toast('Cetak diblokir peramban. Gunakan Unduh Word atau buka dari berkas unduhan.')}}
function dlDoc(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['<html><head><meta charset="utf-8"></head><body>'+_ph+'</body></html>'],{type:'application/msword'}));a.download=_pn+'.doc';a.click()}
function csv(name,rows){const c='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download=name+'.csv';a.click()}
const kop=()=>`<div style="display:flex;align-items:center;gap:12px;border-bottom:3px double #000;padding-bottom:8px;margin-bottom:14px"><img src="${LOGO}" style="height:80px"><div style="flex:1;text-align:center;line-height:1.35">PEMERINTAH KABUPATEN ${H(db.set.kab).toUpperCase()}<br>DINAS PENDIDIKAN<br><b style="font-size:18px">${H(db.set.sekolah).toUpperCase()}</b><br><small>${H(db.set.alamat)}<br>Pos-el: ${H(db.set.email)}</small></div><div style="width:80px"></div></div>`;
const tgld=()=>(db.set.tempat||db.set.kec||'..........')+', '+new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
const ttd=()=>`<div style="margin-top:30px;float:right;text-align:center">${H(tgld())}<br>Kepala Sekolah<br><br><br><br><u>${H(db.set.kepsek||'..............')}</u><br>NIP. ${H(db.set.nip||'..............')}</div><div style="clear:both"></div>`;

// ---------- tabel generik ----------
function tbl(cols,rows,act){return`<div class="tw"><table><tr>${cols.map(c=>'<th>'+c[0]+'</th>').join('')}${act?'<th>Aksi</th>':''}</tr>${rows.map(r=>`<tr>${cols.map(c=>'<td>'+c[1](r)+'</td>').join('')}${act?'<td>'+act(r)+'</td>':''}</tr>`).join('')||'<tr><td colspan="99" style="color:var(--m)">Belum ada data.</td></tr>'}</table></div>`}

// ---------- integrasi Notula Digital ----------
const IBX='sipas_lanas1_inbox';
function inboxOps(){try{const a=JSON.parse(localStorage.getItem(IBX)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function nextNo(y,skipInbox){y=y||db.set.tahun;const a=db.keluar.filter(x=>yrOf(x.tgl)==y).reduce((m,x)=>Math.max(m,x.no||0),0);const b=skipInbox?0:inboxOps().filter(o=>yrOf(o.tgl)==y).reduce((m,o)=>Math.max(m,+o.no||0),0);return Math.max(a,b)+1}
// Menerima nomor surat undangan & nomor notulen dari Notula Digital sebagai Surat Keluar.
const bentrok=(no,tgl,nm,self)=>db.keluar.some(x=>x!==self&&(x.nomor===nm||(+x.no===+no&&yrOf(x.tgl)==yrOf(tgl))));
function procInbox(){
 if(!db)return 0;const ops=inboxOps();if(!ops.length)return 0;let n=0;
 ops.forEach(o=>{
  if(!o||!o.ref||!o.tgl||!o.kode)return;
  const v=db.keluar.find(x=>x.ref===o.ref);
  if(v){
   const ch=v.klasifikasi!==o.kode||v.tgl!==o.tgl;
   if(v.perihal!==o.perihal||ch){
    v.perihal=o.perihal;
    if(ch){let nm=fmtNo(v.no,o.kode,o.tgl);if(bentrok(v.no,o.tgl,nm,v)){v.no=nextNo(yrOf(o.tgl),true);nm=fmtNo(v.no,o.kode,o.tgl)}Object.assign(v,{klasifikasi:o.kode,tgl:o.tgl,nomor:nm})}
    n++}
  }else{
   let no=+o.no||nextNo(yrOf(o.tgl),true),nm=fmtNo(no,o.kode,o.tgl);
   if(bentrok(no,o.tgl,nm)){no=nextNo(yrOf(o.tgl),true);nm=fmtNo(no,o.kode,o.tgl)}
   db.keluar.push({id:uid(),no,nomor:nm,tgl:o.tgl,tujuan:o.tujuan||'-',perihal:o.perihal,klasifikasi:o.kode,ttd:db.set.kepsek,jabatan:'Kepala Sekolah',status:'konsep',sifat:'Biasa',lamp:'',isi:o.isi||'',ref:o.ref,src:'Notula Digital'});n++}
 });
 const done=new Set(ops.map(o=>o&&o.oid));
 if(n){db.log.unshift({t:new Date().toLocaleString('id-ID'),u:'Notula Digital',a:'Menerima '+n+' nomor surat dari Notula Digital'});db.log=db.log.slice(0,500);if(!save())return 0}
 try{localStorage.setItem(IBX,JSON.stringify(inboxOps().filter(o=>!done.has(o&&o.oid))))}catch(e){}
 return n}
function syncInbox(){if(!db)return;const n=procInbox();if(n&&me&&['dash','keluar','arsip'].includes(page)&&$('#mod').style.display!=='flex')VIEW[page]()}
addEventListener('storage',e=>{if(e.key===IBX)syncInbox()});addEventListener('focus',syncInbox);document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncInbox()});
function fmtNo(n,kode,tgl){const d=new Date(tgl||today());return db.set.fmt.replace('{no}',String(n).padStart(3,'0')).replace('{kode}',kode||'000').replace('{kls}',kode||'000').replace('{unit}',db.set.unit||'-').replace('{bln}',d.getMonth()+1).replace('{thn}',d.getFullYear())}

const VIEW={
dash(){
 const y=db.set.tahun,mm=db.masuk.filter(x=>yrOf(x.tglTerima)==y),kk=db.keluar.filter(x=>yrOf(x.tgl)==y);
 const belum=db.masuk.filter(x=>x.status!=='selesai'&&(x.disp||x.status==='baru')).length;

lap(){

function af(k,v){window._af=window._af||{};_af[k]=v;VIEW.arsip()}

function del(t,id){conf('Hapus data ini? Tindakan tidak dapat dibatalkan. Perhatikan ketentuan retensi arsip.',()=>{const it=db[t].find(x=>x.id===id);db[t]=db[t].filter(x=>x.id!==id);log('Hapus surat '+t+': '+(it.nomor||''));save();VIEW[t]()})}
function fMasuk(id){
 const v=id?db.masuk.find(x=>x.id===id):{tglTerima:today(),sifat:'biasa',status:'baru'};
 form(id?'Edit Surat Masuk':'Catat Surat Masuk',[{k:'nomor',l:'Nomor surat',r:1},{k:'tgl',l:'Tanggal surat',t:'date',r:1},{k:'tglTerima',l:'Tanggal diterima',t:'date',r:1},{k:'asal',l:'Asal surat',r:1},{k:'perihal',l:'Perihal',r:1},{k:'klasifikasi',l:'Kode klasifikasi (ketik kode / kata kunci, dari Buku Kode)',t:'kode',r:1},{k:'sifat',l:'Sifat',t:'select',o:['biasa','penting','rahasia']},{k:'status',l:'Status',t:'select',o:ST_M},{k:'file',l:'Lampiran (PDF/gambar)',t:'file'}],v,o=>{
  if(!KLS.includes(o.klasifikasi)){toast('Pilih kode klasifikasi dari Buku Kode');return false}
  if(db.masuk.some(x=>x.id!==id&&x.nomor===o.nomor&&x.asal===o.asal)){toast('Surat dengan nomor & asal yang sama sudah tercatat');return false}
  if(id){Object.assign(v,{...o,file:o.file||v.file});log('Edit surat masuk '+o.nomor)}
  else{const y=yrOf(o.tglTerima),n=db.masuk.filter(x=>yrOf(x.tglTerima)==y).reduce((m,x)=>Math.max(m,x.no||0),0)+1;
   db.masuk.push({id:uid(),no:n,agenda:String(n).padStart(3,'0')+'/'+y,...o});log('Catat surat masuk '+o.nomor)}
  if(!save())return false;VIEW.masuk()})}
function fKeluar(id){
 const v=id?db.keluar.find(x=>x.id===id):{tgl:today(),status:'konsep',ttd:db.set.kepsek,jabatan:'Kepala Sekolah',klasifikasi:'000.1.1'};
 if(!id)v.nomor=fmtNo(nextNo(),v.klasifikasi,v.tgl);
 form(id?'Edit Surat Keluar':'Buat Surat Keluar',[{k:'nomor',l:'Nomor surat (otomatis, koreksi hanya oleh petugas berwenang)',r:1},{k:'tgl',l:'Tanggal',t:'date',r:1},{k:'tujuan',l:'Tujuan',r:1},{k:'perihal',l:'Perihal',r:1},{k:'klasifikasi',l:'Kode klasifikasi (ketik kode / kata kunci, dari Buku Kode)',t:'kode',r:1},{k:'ttd',l:'Nama penandatangan'},{k:'jabatan',l:'Jabatan penandatangan'},{k:'status',l:'Status',t:'select',o:ST_K},{k:'sifat',l:'Sifat',t:'select',o:['Biasa','Penting','Segera']},{k:'lamp',l:'Lampiran (mis. 1 berkas)'},{k:'isi',l:'Isi surat',t:'textarea'},{k:'file',l:'Lampiran PDF',t:'file'}],v,o=>{
  if(!KLS.includes(o.klasifikasi)){toast('Pilih kode klasifikasi dari Buku Kode');return false}
  if(db.keluar.some(x=>x.id!==id&&x.nomor===o.nomor)){toast('Nomor surat sudah dipakai!');return false}
  if(id){if(v.nomor!==o.nomor)log('Koreksi nomor surat: '+v.nomor+' → '+o.nomor);Object.assign(v,{...o,file:o.file||v.file});log('Edit surat keluar '+o.nomor)}
  else{db.keluar.push({id:uid(),no:nextNo(),...o});log('Buat surat keluar '+o.nomor)}
  if(!save())return false;VIEW.keluar()});if(!id)setTimeout(()=>{const u=()=>{$('#f_nomor').value=fmtNo(nextNo(),$('#f_klasifikasi').value,$('#f_tgl').value)};['klasifikasi','tgl'].forEach(k=>$('#f_'+k).addEventListener('change',u))},50)}
function fDisp(id){const it=db.masuk.find(x=>x.id===id),d=it.disp||{tgl:today()};
 form('Disposisi: '+H(it.perihal),[{k:'tujuan',l:'Ditugaskan kepada',t:'select',o:db.users.map(u=>[u.id,u.nama+' ('+ROLE[u.role]+')']),d:d.tujuan},{k:'instruksi',l:'Instruksi Kepala Sekolah',t:'textarea',r:1},{k:'tgl',l:'Tanggal disposisi',t:'date'},{k:'batas',l:'Batas penyelesaian',t:'date'}],d,o=>{
  it.disp=o;if(it.status==='baru')it.status='didisposisikan';(it.riwayat=it.riwayat||[]).push(fd(today())+': Disposisi kepada '+uname(o.tujuan));log('Disposisi '+it.agenda);save();VIEW.disp()})}

function prnAgenda(id){const r=db.masuk.find(x=>x.id===id);prn(kop()+`<h3 style="text-align:center">LEMBAR AGENDA SURAT MASUK</h3><table>${[['No. Agenda',r.agenda],['Nomor Surat',r.nomor],['Tanggal Surat',fd(r.tgl)],['Diterima',fd(r.tglTerima)],['Asal',r.asal],['Perihal',r.perihal],['Klasifikasi',r.klasifikasi],['Sifat',r.sifat]].map(a=>`<tr><td width="30%">${a[0]}</td><td>${H(a[1])}</td></tr>`).join('')}</table>`)}
function prnDisp(id){const r=db.masuk.find(x=>x.id===id),d=r.disp||{};prn(kop()+`<h3 style="text-align:center">LEMBAR DISPOSISI</h3><table>${[['No. Agenda',r.agenda],['Nomor Surat',r.nomor],['Asal',r.asal],['Perihal',r.perihal],['Sifat',r.sifat],['Diteruskan kepada',d.tujuan?uname(d.tujuan):''],['Instruksi',d.instruksi||''],['Tanggal disposisi',d.tgl?fd(d.tgl):''],['Batas waktu',d.batas?fd(d.batas):'']].map(a=>`<tr><td width="30%">${a[0]}</td><td>${H(a[1])}</td></tr>`).join('')}</table>`+ttd())}
function prnSurat(id){const r=db.keluar.find(x=>x.id===id);
 prn(kop()+`<div style="display:flex;justify-content:space-between"><table style="width:60%;font-size:13px"><tr><td width="80">Nomor</td><td>: ${H(r.nomor)}</td></tr><tr><td>Sifat</td><td>: ${H(r.sifat||'Biasa')}</td></tr><tr><td>Lampiran</td><td>: ${H(r.lamp||'-')}</td></tr><tr><td>Perihal</td><td>: ${H(r.perihal)}</td></tr></table><div>${H(db.set.kec)}, ${fd(r.tgl)}</div></div>
 <p style="margin-top:20px">Yth. ${H(r.tujuan)}<br>di tempat</p><p style="white-space:pre-wrap;text-align:justify;line-height:1.6">${H(r.isi||'')}</p>
 <div style="margin-top:30px;float:right;text-align:center">${H(tgld())}<br>${H(r.jabatan)}<br><br><br><br><u>${H(r.ttd||'..............')}</u>${r.ttd===db.set.kepsek&&db.set.nip?'<br>NIP. '+H(db.set.nip):''}</div><div style="clear:both"></div>`,'surat-'+r.nomor);log('Cetak surat '+r.nomor)}
function prnBukuK(){prn(kop()+`<h3 style="text-align:center">BUKU AGENDA SURAT KELUAR TAHUN ${db.set.tahun}</h3>`+tbl([['Nomor',r=>H(r.nomor)],['Tanggal',r=>fd(r.tgl)],['Tujuan',r=>H(r.tujuan)],['Perihal',r=>H(r.perihal)],['Status',r=>r.status]],db.keluar.filter(x=>yrOf(x.tgl)==db.set.tahun)))}
function lapo(mode){
 const j=$('#lj').value,b=$('#lb').value,y=db.set.tahun,inP=d=>yrOf(d)==y&&(!b||new Date(d).getMonth()==b-1);
 let cols,rows,title;
 if(j==='masuk'){rows=db.masuk.filter(x=>inP(x.tglTerima));cols=[['Agenda',r=>r.agenda],['Nomor',r=>r.nomor],['Tgl Surat',r=>fd(r.tgl)],['Diterima',r=>fd(r.tglTerima)],['Asal',r=>r.asal],['Perihal',r=>r.perihal],['Status',r=>r.status]];title='Laporan Surat Masuk'}
 else if(j==='keluar'){rows=db.keluar.filter(x=>inP(x.tgl));cols=[['Nomor',r=>r.nomor],['Tanggal',r=>fd(r.tgl)],['Tujuan',r=>r.tujuan],['Perihal',r=>r.perihal],['Penandatangan',r=>r.ttd],['Status',r=>r.status]];title='Laporan Surat Keluar'}
 else if(j==='rekap'){rows=KLS.map(k=>({k,m:db.masuk.filter(x=>inP(x.tglTerima)&&x.klasifikasi===k).length,o:db.keluar.filter(x=>inP(x.tgl)&&x.klasifikasi===k).length})).filter(r=>r.m||r.o);cols=[['Klasifikasi',r=>r.k+' '+ur(r.k)],['Masuk',r=>r.m],['Keluar',r=>r.o]];title='Rekapitulasi Surat per Klasifikasi'}
 else{rows=db.masuk.filter(x=>x.disp&&inP(x.tglTerima));cols=[['Agenda',r=>r.agenda],['Perihal',r=>r.perihal],['Kepada',r=>uname(r.disp.tujuan)],['Batas',r=>fd(r.disp.batas)],['Status',r=>r.status]];title='Laporan Tindak Lanjut Disposisi'}
 const per=(b?BLN[b-1]+' ':'Tahun ')+y;
 if(mode==='csv')csv(title+' '+per,[cols.map(c=>c[0]),...rows.map(r=>cols.map(c=>c[1](r)))]);
 else prn(kop()+`<h3 style="text-align:center">${title.toUpperCase()}<br>${per}</h3>`+`<p>Jumlah data: <b>${rows.length}</b>${j==='masuk'||j==='disp'?' · Selesai: <b>'+rows.filter(x=>x.status==='selesai').length+'</b> · Belum selesai: <b>'+rows.filter(x=>x.status!=='selesai').length+'</b>':''}${j==='keluar'?' · Terkirim: <b>'+rows.filter(x=>x.status==='terkirim').length+'</b>':''}${j==='masuk'?' · Sifat penting/rahasia: <b>'+rows.filter(x=>x.sifat!=='biasa').length+'</b>':''}</p>`+tbl([['No',r=>rows.indexOf(r)+1],...cols.map(c=>[c[0],r=>H(c[1](r))])],rows)+`<p style="font-size:11px">Dicetak: ${new Date().toLocaleString('id-ID')} oleh ${H(me.nama)}</p>`+ttd());
 log('Laporan: '+title)}

function doPost(e){
  var lock=LockService.getScriptLock();
  try{
    lock.waitLock(20000);
    var d=JSON.parse(e.postData.contents);
    if(d.token!==TOKEN)return out({ok:false,error:'Token tidak cocok'});
    var ss=SpreadsheetApp.getActiveSpreadsheet();
    put(ss,'Surat Masuk',d.masuk);
    put(ss,'Surat Keluar',d.keluar);
    put(ss,'Disposisi',d.disp);
    saveBackup(ss,d.backup||'');
    ringkasan(ss);
    catat(ss,d);
    return out({ok:true});
  }catch(err){
    return out({ok:false,error:String(err)});
  }finally{
    lock.releaseLock();
  }
}

function doGet(e){
  var cb=e&&e.parameter&&e.parameter.callback;
  if(cb&&!/^[A-Za-z0-9_]+$/.test(cb))cb='';
  try{
    if(!e||!e.parameter||e.parameter.token!==TOKEN)return kirim({ok:false,error:'Token tidak cocok'},cb);
    var b=SpreadsheetApp.getActiveSpreadsheet().getSheetByName('_backup');
    var s='';
    if(b&&b.getLastRow()>0){
      s=b.getRange(1,1,b.getLastRow(),1).getValues().map(function(r){return r[0]}).join('');
    }
    return kirim({ok:true,backup:s},cb);
  }catch(err){
    return kirim({ok:false,error:String(err)},cb);
  }
}
function kirim(o,cb){
  if(!cb)return out(o);
  return ContentService.createTextOutput(cb+'('+JSON.stringify(o)+')').setMimeType(ContentService.MimeType.JAVASCRIPT);
}

// Menulis satu tab data lengkap dengan format header, filter, dan lebar kolom
function put(ss,nama,rows){
  var sh=ss.getSheetByName(nama)||ss.insertSheet(nama);
  sh.clear();
  if(sh.getFilter())sh.getFilter().remove();
  if(!rows||!rows.length)return;
  var n=rows.length,k=rows[0].length;
  var g=sh.getRange(1,1,n,k);
  g.setNumberFormat('@').setValues(rows);
  g.setVerticalAlignment('top').setWrapStrategy(SpreadsheetApp.WrapStrategy.WRAP);
  sh.getRange(1,1,1,k).setFontWeight('bold').setFontColor('#ffffff').setBackground(BIRU);
  sh.setFrozenRows(1);
  g.createFilter();
  for(var c=1;c<=k;c++){
    sh.autoResizeColumn(c);
    if(sh.getColumnWidth(c)>320)sh.setColumnWidth(c,320);
  }
}

// Cadangan JSON dipecah per 40.000 karakter (batas sel Google Sheets 50.000)
function saveBackup(ss,teks){
  var b=ss.getSheetByName('_backup')||ss.insertSheet('_backup');
  b.clear();
  var rows=[];
  for(var i=0;i<teks.length;i+=CHUNK)rows.push([teks.substr(i,CHUNK)]);
  if(rows.length)b.getRange(1,1,rows.length,1).setNumberFormat('@').setValues(rows);
  b.getRange(1,2).setValue('Cadangan otomatis SIPAS, jangan diubah: '+new Date());
  b.hideSheet();
}

// Tab Ringkasan dibuat sekali (rumus otomatis); ganti tahun di sel B1
function ringkasan(ss){
  if(ss.getSheetByName('Ringkasan'))return;
  var sh=ss.insertSheet('Ringkasan',0);
  sh.getRange('A1:B1').setValues([['Tahun',new Date().getFullYear()]]);
  sh.getRange('A2:A3').setValues([['Total surat masuk'],['Total surat keluar']]);
  sh.getRange('B2').setFormula('=COUNTIF(\\'Surat Masuk\\'!$D$2:$D,$B$1&"-*")');
  sh.getRange('B3').setFormula('=COUNTIF(\\'Surat Keluar\\'!$B$2:$B,$B$1&"-*")');
  sh.getRange('A4').setValue('Masuk belum selesai (semua tahun)');
  sh.getRange('B4').setFormula('=COUNTA(\\'Surat Masuk\\'!$A$2:$A)-COUNTIF(\\'Surat Masuk\\'!$J$2:$J,"selesai")');
  sh.getRange('A6:C6').setValues([['Bulan','Surat masuk','Surat keluar']]);
  var bln=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  for(var m=1;m<=12;m++){
    var r=6+m,mm=('0'+m).slice(-2);
    sh.getRange(r,1).setValue(bln[m-1]);
    sh.getRange(r,2).setFormula('=COUNTIF(\\'Surat Masuk\\'!$D$2:$D,$B$1&"-'+mm+'-*")');
    sh.getRange(r,3).setFormula('=COUNTIF(\\'Surat Keluar\\'!$B$2:$B,$B$1&"-'+mm+'-*")');
  }
  sh.getRange('A1:A4').setFontWeight('bold');
  sh.getRange('A6:C6').setFontWeight('bold').setFontColor('#ffffff').setBackground(BIRU);
  sh.setColumnWidth(1,230);sh.setColumnWidth(2,110);sh.setColumnWidth(3,110);
}

// Riwayat sinkronisasi (200 terakhir)
function catat(ss,d){
  var sh=ss.getSheetByName('Log Sinkron');
  if(!sh){
    sh=ss.insertSheet('Log Sinkron');
    sh.appendRow(['Waktu','Surat masuk','Surat keluar','Disposisi']);
    sh.getRange(1,1,1,4).setFontWeight('bold');
  }
  sh.appendRow([new Date(),(d.masuk||[]).length-1,(d.keluar||[]).length-1,(d.disp||[]).length-1]);
  var lebih=sh.getLastRow()-201;
  if(lebih>0)sh.deleteRows(2,lebih);
}

  SpreadsheetApp.getUi().createMenu('SIPAS LANAS 1')
    .addItem('Info sinkronisasi terakhir','info')
    .addItem('Tampilkan/sembunyikan tab _backup','toggleBackup')
    .addToUi();
}
function info(){
  var sh=SpreadsheetApp.getActiveSpreadsheet().getSheetByName('Log Sinkron');
  var t=(sh&&sh.getLastRow()>1)?'Terakhir: '+sh.getRange(sh.getLastRow(),1).getValue():'Belum ada sinkronisasi.';
  SpreadsheetApp.getUi().alert(t);
}
function toggleBackup(){
  var b=SpreadsheetApp.getActiveSpreadsheet().getSheetByName('_backup');
  if(!b)return;
  if(b.isSheetHidden())b.showSheet();else b.hideSheet();
}
