<style>
:root{--bg:#edf1f6;--c:#fff;--t:#14233a;--m:#5d6b80;--p:#0f2a47;--b:#d5dde8;--ac:#e8741e;--bl:#1b6ec2;--ok:#16794c;--wr:#b45309;--er:#b91c1c;--fh:'Zilla Slab',Rockwell,'Courier New',serif;--air:repeating-linear-gradient(-45deg,#e8741e 0 12px,#fff 12px 24px,#1b6ec2 24px 36px,#fff 36px 48px);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

@media(max-width:760px){#app{flex-direction:column}nav{width:100%;position:static;display:flex;overflow-x:auto;padding:8px;gap:6px;border-bottom:1px solid var(--b)}nav a{white-space:nowrap;margin:0}main{padding:16px 14px 30px}header .sub,.who div{display:none}}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.stat{outline:2px dashed var(--ac);outline-offset:-8px;padding:22px!important}

.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{padding:9px 10px;border-bottom:1px solid var(--b);text-align:left;vertical-align:top}

button,.btn{background:var(--p);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font:600 13px 'Plus Jakarta Sans',system-ui,sans-serif}
button:hover,.btn:hover{filter:brightness(1.15)}button:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.s,.btn.s{background:var(--b);color:var(--t)}button.d{background:var(--er)}button.x{padding:4px 9px;font-size:12px;margin:1px}

.tag[data-s=baru],.tag[data-s=rahasia],.tag[data-s=segera]{color:var(--ac)}.tag[data-s=didisposisikan],.tag[data-s=diperiksa],.tag[data-s=penting]{color:var(--wr)}
.tag[data-s=diproses],.tag[data-s=disetujui]{color:var(--bl)}.tag[data-s=ditandatangani]{color:#6d3fb0}.tag[data-s=selesai],.tag[data-s=terkirim]{color:var(--ok)}

#pa{display:none}

#pa th,#mod th{color:#000;font-size:inherit;border-bottom:1px solid #888;background:#eee}#pa td,#mod td{border-bottom:1px solid #bbb;color:#000}#pa tr:hover td,#mod tr:hover td{background:none}
.srt{font:12pt/1.4 Arial,Helvetica,sans-serif;color:#000;background:#fff;min-width:600px}
.srt table{border-collapse:collapse}.srt td,.srt th{border:0!important;padding:0 3px;background:none!important;vertical-align:top;color:#000;font-size:inherit;white-space:normal}
.srt .kop,.srt .nm,.srt .ttd-w{width:100%}.srt .kl{border-top:3px solid #000;border-bottom:1px solid #000;height:2px;margin:4px 0 14px}
.srt .isi{margin-top:12px}.srt .isi p{margin:0 0 8px;text-align:justify}.srt .ttd-w{margin-top:28px;page-break-inside:avoid}.srt .ttd{width:50%;padding-left:24px}.srt .tb{margin-top:24px;page-break-inside:avoid}.srt .kp{width:100%}.srt .kp td{padding:2px 3px}.srt .lt{width:100%;margin-top:10px}.srt .lt td,.srt .lt th{border:1px solid #000!important;padding:3px 5px;font-size:11pt}.srt .lt th{text-align:center;font-weight:bold}
@page{size:A4;margin:2cm 2cm 2.5cm 3cm;@top-center{content:"- " counter(page) " -";font:12pt Arial,sans-serif;color:#000}}@page:first{@top-center{content:none}}
@media print{body>*:not(#pa){display:none!important}#pa{display:block;color:#000;background:#fff;padding:0}#pa table{font-size:12px}#pa .srt{min-width:0}#pa .srt table{font-size:12pt}}
@media print{#sy{display:none!important}#pa .pgb{border:0!important;margin:0!important}#pa .pgb::after{display:none!important}}
.pgb{page-break-before:always;break-before:page;height:0;margin:0}#mod .pgb{border-top:2px dashed #888;margin:26px -16px 18px;position:relative}#mod .pgb::after{content:'halaman berikutnya';position:absolute;right:0;top:-9px;background:#fff;color:#555;font:11px Arial,sans-serif;padding:0 8px}
.srt .lt thead{display:table-header-group}.srt .lt tr{page-break-inside:avoid}
</style></head><body>
<div id="root"></div><div id="mod"></div><div id="toast"></div><div id="pa"></div>
<script>
const $=s=>document.querySelector(s),H=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const ROLE={admin:'Administrator',kepsek:'Kepala Sekolah',operator:'Petugas TU/Operator',guru:'Guru/Staf'};
const KEY='sipas_lanas1_db';let db,me=null,page='dash';
const def=()=>({set:{sekolah:'UPTD SPF SD Negeri Lanas 1',kec:'Botolinggo',kab:'Bondowoso',alamat:'Jalan Guce Desa Lanas, Kec. Botolinggo, Bondowoso, Jawa Timur 68284',kepsek:'Sahwanto, S.Pd.',nip:'198111142008011012',tahun:new Date().getFullYear(),unit:'430.9.9.2.484',email:'sdnlanas01bot@gmail.com',fmt:'{kode}/{no}/{unit}/{thn}'},users:[],masuk:[],keluar:[],log:[]});
function load(){try{db=JSON.parse(localStorage.getItem(KEY))||def()}catch(e){db=def()}if(!db.set.adminSeed){const H0='bbad10e17b97a8ad77128494b6c98300a3ba0cfa2391d4a2231c12e50476b525',a=db.users.find(x=>x.user==='admin');if(a){a.h=H0;a.role='admin'}else db.users.push({id:uid(),nama:'Administrator',user:'admin',role:'admin',h:H0});db.set.adminSeed=1;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}if(db.set.tempat===undefined)db.set.tempat=db.set.kec;if(!db.set.gsSeed){db.set.sheetUrl='https://script.google.com/macros/s/AKfycbwpVGyLK7lLftYCr_DeFSn2Hncz0kG4DyuvTgZGExnmJshgz2WCQeVHpmo0S2ENSSC8Eg/exec';db.set.sheetToken='Lanas01@2023';db.set.gsSeed=1;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}if(!db.set.sheetToken)db.set.sheetToken=[...crypto.getRandomValues(new Uint8Array(24))].map(x=>x.toString(16).padStart(2,'0')).join('');if(!db.set.unit){const d=def().set;Object.assign(db.set,{unit:d.unit,email:d.email,fmt:d.fmt});['alamat','kepsek','nip'].forEach(k=>{if(!db.set[k])db.set[k]=d[k]})}}
function save(){stamp();try{localStorage.setItem(KEY,JSON.stringify(db));schedSync();return true}catch(e){toast('Penyimpanan penuh! Ekspor cadangan & kurangi ukuran lampiran.');return false}}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}
function log(a){db.log.unshift({t:new Date().toLocaleString('id-ID'),u:me?me.nama:'-',a});db.log=db.log.slice(0,500)}
async function hash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sipas:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const uid=()=>Math.random().toString(36).slice(2,9);
const rid=r=>'n_'+String(r).replace(/[^A-Za-z0-9]/g,'_');
var RACK=[];
const today=()=>new Date().toISOString().slice(0,10);
const fd=d=>d?new Date(d).toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'}):'-';
const uname=id=>(db.users.find(u=>u.id===id)||{}).nama||'-';
const can=r=>r.includes(me.role);

// ---------- login ----------
function login(){
 const first=!db.users.length,k=`onkeydown="if(event.key==='Enter')doLogin(${first})"`;
 $('#root').innerHTML=`<div class="login"><section class="lb"><img src="${LOGO}" alt=""><h1>SIPAS<br>LANAS 1</h1><p>Sistem Informasi Persuratan &amp; Arsip Sekolah<br><b>${H(db.set.sekolah)}</b><br>Kec. ${H(db.set.kec)}, Kab. ${H(db.set.kab)}</p><div class="chips"><span>Surat Masuk</span><span>Surat Keluar</span><span>Disposisi</span><span>Arsip Digital</span></div><div class="pmk"><i>${H(db.set.kab).toUpperCase()}<br>${db.set.tahun}</i><u></u></div></section>
 <section class="lf"><div class="lc"><h2>${first?'Buat akun administrator':'Masuk'}</h2><p style="color:var(--m)">${first?'Akun ini mengelola seluruh pengguna dan pengaturan.':'Kelola surat masuk, surat keluar, dan arsip sekolah.'}</p>
 ${first?'<label>Nama lengkap</label><input id="ln">':''}
 <label>Username</label><input id="lu" autocomplete="username" ${k}><label>Kata sandi ${first?'(min. 8 karakter)':''}</label><input id="lp" type="password" autocomplete="current-password" ${k}><p><button onclick="doLogin(${first})">${first?'Buat akun dan masuk':'Masuk'}</button></p><small id="le" style="color:var(--er)"></small></div></section></div>`;
}
async function doLogin(first){
 const u=$('#lu').value.trim(),p=$('#lp').value,e=$('#le');
 if(!(window.crypto&&crypto.subtle)){e.textContent='Buka file ini langsung dari komputer/HP (bukan lewat http biasa), atau gunakan https.';return}
 if(!u||!p){e.textContent='Lengkapi username dan kata sandi.';return}
 if(first){if(p.length<8){e.textContent='Kata sandi minimal 8 karakter.';return}
  db.users.push({id:uid(),nama:$('#ln').value.trim()||u,user:u,role:'admin',h:await hash(p)});me=db.users[0];log('Membuat akun administrator');save()}
 else{
  const h=await hash(p);const f=db.users.find(x=>x.user===u&&x.h===h);
  if(!f){e.textContent='Username atau kata sandi salah. Di perangkat baru, tunggu status sinkron (kiri bawah) selesai lalu coba lagi.';return}me=f;log('Login')}
 sessionStorage.setItem('sipas_me',me.id);save();shell();
}
function logout(){log('Logout');save();me=null;sessionStorage.removeItem('sipas_me');login()}

// ---------- shell ----------
const MENU=[['dash','Dashboard',['admin','kepsek','operator','guru']],['masuk','Surat Masuk',['admin','kepsek','operator']],['keluar','Surat Keluar',['admin','kepsek','operator']],['disp','Disposisi',['admin','kepsek','operator','guru']],['arsip','Arsip Digital',['admin','kepsek','operator']],['lap','Laporan',['admin','kepsek','operator']],['data','Impor/Ekspor',['admin','kepsek','operator']],['pengaturan','Pengaturan',['admin']],['panduan','Panduan',['admin','kepsek','operator','guru']]];
function shell(){
 $('#root').innerHTML=`<header><img class="lg-s" src="${LOGO}" alt=""><div class="brand"><b>SIPAS LANAS 1</b><small class="sub">${H(db.set.sekolah)}, Kec. ${H(db.set.kec)}, ${H(db.set.kab)}</small></div><span class="sp"></span><div class="who"><div><b>${H(me.nama)}</b><small>${ROLE[me.role]}</small></div><span class="av">${H(me.nama.charAt(0).toUpperCase())}</span></div><button class="s" onclick="logout()">Keluar</button></header>
 <div id="app"><nav>${MENU.filter(m=>can(m[2])).map(m=>`<a data-p="${m[0]}" onclick="go('${m[0]}')">${m[1]}</a>`).join('')}</nav><main id="main"></main></div>`;
 go(page);
}
function go(p){if(!can(MENU.find(m=>m[0]===p)[2]))p='dash';page=p;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.p===p));$('#main').innerHTML='';VIEW[p]()}
const M=h=>{$('#main').innerHTML=h;document.querySelectorAll('#main .tag').forEach(t=>t.dataset.s=t.textContent.trim().toLowerCase())};

// ---------- modal & form ----------
function modal(h,w){const m=$('#mod');m.innerHTML='<div'+(w?' style="max-width:'+w+'px"':'')+'>'+h+'</div>';m.style.display='flex'}
function closeM(){$('#mod').style.display='none'}
function form(title,fields,v,ok){
 window._ok=ok;window._f=fields;
 modal(`<h3 style="margin-top:0">${title}</h3>${fields.map(f=>{const val=v[f.k]??f.d??'';let i;
  if(f.t==='select')i=`<select id="f_${f.k}">${f.o.map(o=>{const[a,b]=Array.isArray(o)?o:[o,o];return`<option value="${H(a)}" ${a==val?'selected':''}>${H(b)}</option>`}).join('')}</select>`;
  else if(f.t==='kode')i=`<div class="kdw"><input id="f_${f.k}" value="${H(val)}" autocomplete="off" placeholder="Ketik kode atau kata kunci, lalu pilih dari daftar"><div class="kdl"></div><small class="kdi"></small></div>`;
  else if(f.t==='textarea')i=`<textarea id="f_${f.k}" rows="3">${H(val)}</textarea>`;
  else if(f.t==='file')i=`<input id="f_${f.k}" type="file" accept=".pdf,image/*">${v[f.k]?'<small>Lampiran saat ini: '+H(v[f.k].name)+'</small>':''}`;
  else i=`<input id="f_${f.k}" type="${f.t||'text'}" value="${H(val)}">`;
  return`<label>${f.l}${f.r?' *':''}</label>${i}`}).join('')}
 <p><button onclick="subForm()">Simpan</button> <button class="s" onclick="closeM()">Batal</button></p>`);document.querySelectorAll(".kdw input").forEach(initKode)
}
function kdFind(q){q=q.toLowerCase().trim();if(!q)return KODE.slice(0,15);const tk=q.split(/\s+/);
 return KODE.filter(k=>{const h=(k[0]+' '+k[1]+' '+(ALIAS[k[0]]||'')).toLowerCase();return tk.every(t=>h.includes(t))}).sort((a,b)=>(b[0].startsWith(q))-(a[0].startsWith(q))).slice(0,40)}
function initKode(inp){const box=inp.parentNode.querySelector('.kdl'),info=inp.parentNode.querySelector('.kdi');let items=[],hi=0,quiet=false;
 const show=()=>{const ok=KLS.includes(inp.value);info.textContent=ok?'✓ '+inp.value+' — '+ur(inp.value):(inp.value.trim()?'Belum ada kode terpilih — pilih salah satu dari daftar':'');info.style.color=ok?'var(--ok)':'var(--wr)'};
 const pick=c=>{quiet=true;inp.value=c;box.style.display='none';show();['input','change'].forEach(e=>inp.dispatchEvent(new Event(e,{bubbles:true})));quiet=false};
 const mark=()=>[...box.children].forEach((d,i)=>{d.classList.toggle('on',i===hi);if(i===hi&&d.scrollIntoView)d.scrollIntoView({block:'nearest'})});
 const render=()=>{items=kdFind(inp.value);hi=0;box.innerHTML=items.map((k,i)=>`<div data-c="${k[0]}"${i?'':' class="on"'}><b>${k[0]}</b> ${H(k[1])}${ALIAS[k[0]]?`<small> — ${H(ALIAS[k[0]])}</small>`:''}</div>`).join('')||'<div><small>Tidak ada kode yang cocok</small></div>';box.style.display='block'};
 inp.addEventListener('input',()=>{if(quiet)return;render();show()});

 if(!db)return 0;const ops=inboxOps();if(!ops.length)return 0;let n=0;

const TM={};[{"key":"01 Kedinasan · Undangan Rapat","k":"400.3.5.02","p":"Undangan Rapat [[nama rapat]]","t":"[[Bapak/Ibu ...]]","isi":"Dengan hormat,\n\nSehubungan dengan pelaksanaan [[nama rapat]] di {sekolah}, kami mengundang Bapak/Ibu untuk hadir pada:\n\nhari, tanggal : [[hari, tanggal]]\npukul : [[pukul]] WIB s.d. selesai\ntempat : [[tempat]]\nacara : [[acara]]\n\nMengingat pentingnya acara tersebut, kami mohon kehadiran Bapak/Ibu tepat waktu.\n\nDemikian undangan ini kami sampaikan, atas perhatian dan kehadirannya kami ucapkan terima kasih."},{"key":"01 Kedinasan · Surat Edaran","k":"000.1.1","p":"[[hal yang diedarkan]]","t":"Seluruh guru, tenaga kependidikan, dan peserta didik","isi":"Dengan hormat,\n\nDalam rangka [[latar belakang/dasar]], dengan ini kami sampaikan hal-hal sebagai berikut:\n\n1. [[butir 1]]\n2. [[butir 2]]\n3. [[butir 3]]\n\nDemikian surat edaran ini disampaikan untuk dilaksanakan sebagaimana mestinya.","ti":"SURAT EDARAN","sub":true},{"key":"01 Kedinasan · Surat Pengantar","k":"400.3.5.15","p":"Pengantar [[nama berkas/dokumen]]","t":"[[Pihak yang dituju]]","isi":"Dengan hormat,\n\nBersama ini kami sampaikan [[nama berkas/dokumen]] sebanyak [[jumlah]] berkas dari {sekolah}, dengan rincian terlampir.\n\nMohon kiranya dokumen tersebut dapat diterima dan diproses sebagaimana mestinya.\n\nDemikian surat ini kami sampaikan, atas perhatian dan kerja samanya kami ucapkan terima kasih."},{"key":"01 Kedinasan · Surat Permohonan","k":"000.1.1","p":"Permohonan [[hal yang dimohonkan]]","t":"[[Pihak yang dituju]]","isi":"Dengan hormat,\n\nSehubungan dengan [[alasan/latar belakang]], dengan ini kami mengajukan permohonan [[hal yang dimohonkan]] untuk {sekolah}.\n\nBesar harapan kami permohonan ini dapat dikabulkan. Atas perhatian dan bantuan Bapak/Ibu, kami ucapkan terima kasih."},{"key":"01 Kedinasan · Surat Pemberitahuan","k":"000.1.1","p":"Pemberitahuan [[hal]]","t":"[[Pihak yang dituju]]","isi":"Dengan hormat,\n\nDengan ini kami memberitahukan bahwa [[isi pemberitahuan]], yang akan dilaksanakan pada [[hari, tanggal]] di [[tempat]].\n\nDemikian pemberitahuan ini kami sampaikan untuk dimaklumi dan dipergunakan sebagaimana mestinya."},{"key":"01 Kedinasan · Surat Balasan","k":"000.1.1","p":"Balasan Surat [[nomor/hal surat yang dibalas]]","t":"[[Pihak yang dituju]]","isi":"Dengan hormat,\n\nMenanggapi surat Saudara Nomor [[nomor surat]] tanggal [[tanggal surat]] perihal [[hal surat]], dengan ini kami sampaikan bahwa [[isi jawaban]].\n\nDemikian surat ini kami sampaikan, atas perhatian dan kerja samanya kami ucapkan terima kasih."},{"key":"02 Peserta Didik · Keterangan Siswa Aktif","k":"400.3.12.1","p":"Keterangan Peserta Didik Aktif","t":"Yang bersangkutan","isi":"Yang bertanda tangan di bawah ini, Kepala {sekolah}, menerangkan bahwa:\n\nnama : [[nama peserta didik]]\ntempat, tanggal lahir : [[tempat, tanggal lahir]]\nnip/nis : NISN [[NISN]]\njabatan/kelas : Kelas [[kelas]]\nalamat : [[alamat]]\n\nBenar bahwa yang bersangkutan adalah peserta didik aktif di {sekolah} pada Tahun Pelajaran {tp}.\n\nDemikian surat keterangan ini dibuat untuk dipergunakan sebagaimana mestinya.","ti":"SURAT KETERANGAN","sub":false},{"key":"02 Peserta Didik · Keterangan Pindah Sekolah","k":"400.3.5.09","p":"Keterangan Pindah Sekolah","t":"[[Kepala sekolah tujuan]]","isi":"Yang bertanda tangan di bawah ini, Kepala {sekolah}, menerangkan bahwa:\n\nnama : [[nama peserta didik]]\ntempat, tanggal lahir : [[tempat, tanggal lahir]]\nnip/nis : NISN [[NISN]]\njabatan/kelas : Kelas [[kelas]]\nalamat : [[alamat]]\n\nadalah peserta didik {sekolah} yang mengajukan pindah ke [[nama sekolah tujuan]] dengan alasan [[alasan pindah]]. Selama belajar di sekolah kami yang bersangkutan berkelakuan baik dan tidak memiliki tanggungan.\n\nDemikian surat keterangan ini dibuat untuk dipergunakan sebagaimana mestinya.","ti":"SURAT KETERANGAN PINDAH SEKOLAH","sub":false},{"key":"02 Peserta Didik · Panggilan Orang Tua/Wali","k":"400.3.12.1","p":"Panggilan Orang Tua/Wali Peserta Didik","t":"Orang tua/wali dari [[nama peserta didik]] kelas [[kelas]]","isi":"Dengan hormat,\n\nSehubungan dengan [[permasalahan/keperluan]] yang berkaitan dengan putra/putri Bapak/Ibu, kami mohon kehadiran Bapak/Ibu di sekolah pada:\n\nhari, tanggal : [[hari, tanggal]]\npukul : [[pukul]] WIB\ntempat : [[tempat]]\n\nKehadiran Bapak/Ibu sangat kami harapkan demi kebaikan bersama.\n\nDemikian disampaikan, atas perhatian dan kerja samanya kami ucapkan terima kasih."},{"key":"02 Peserta Didik · Dispensasi/Izin Peserta Didik","k":"400.3.12.1","p":"Dispensasi Peserta Didik","t":"Yang bersangkutan","isi":"Yang bertanda tangan di bawah ini, Kepala {sekolah}, menerangkan bahwa:\n\nnama : [[nama peserta didik]]\njabatan/kelas : Kelas [[kelas]]\n\nmemperoleh dispensasi/izin tidak mengikuti kegiatan pembelajaran pada [[hari, tanggal]] karena [[alasan]].\n\nDemikian surat ini dibuat untuk dipergunakan sebagaimana mestinya.","ti":"SURAT DISPENSASI","sub":false},{"key":"02 Peserta Didik · Rekomendasi Peserta Didik","k":"400.3.5.10","p":"Rekomendasi Peserta Didik","t":"[[Pihak yang dituju]]","isi":"Yang bertanda tangan di bawah ini, Kepala {sekolah}, menerangkan bahwa:\n\nnama : [[nama peserta didik]]\nnip/nis : NISN [[NISN]]\njabatan/kelas : Kelas [[kelas]]\n\nadalah peserta didik {sekolah} yang berkelakuan baik dan kami rekomendasikan untuk [[tujuan rekomendasi]].\n\nDemikian surat rekomendasi ini dibuat untuk dipergunakan sebagaimana mestinya.","ti":"SURAT REKOMENDASI","sub":false},{"key":"03 Kepegawaian · Keterangan Melaksanakan Tugas","k":"800.1.13","p":"Keterangan Melaksanakan Tugas","t":"Yang bersangkutan","isi":"Yang bertanda tangan di bawah ini, Kepala {sekolah}, menerangkan bahwa:\n\nnama : [[nama guru/tenaga kependidikan]]\nnip : [[NIP/NUPTK]]\npangkat/golongan : [[pangkat/golongan]]\njabatan : [[jabatan]]\n\nbenar yang bersangkutan melaksanakan tugas di {sekolah} sejak [[tanggal mulai tugas]] sampai dengan sekarang.\n\nDemikian surat keterangan ini dibuat untuk dipergunakan sebagaimana mestinya.","ti":"SURAT KETERANGAN MELAKSANAKAN TUGAS","sub":false},{"key":"03 Kepegawaian · Pernyataan","k":"400.3.5.06","p":"Pernyataan [[hal yang dinyatakan]]","t":"Yang bersangkutan","isi":"Yang bertanda tangan di bawah ini:\n\nnama : [[nama]]\nnip : [[NIP]]\njabatan : [[jabatan]]\n\nmenyatakan dengan sebenarnya bahwa [[isi pernyataan]].\n\nDemikian surat pernyataan ini dibuat dengan sebenar-benarnya untuk dipergunakan sebagaimana mestinya.","ti":"SURAT PERNYATAAN","sub":false},{"key":"03 Kepegawaian · Rekomendasi Cuti/Izin","k":"800.1.11.4","p":"Rekomendasi Cuti [[jenis cuti]]","t":"[[Pejabat yang berwenang]]","isi":"Dengan hormat,\n\nMenindaklanjuti permohonan [[nama pegawai]] ([[jabatan]]) pada {sekolah}, dengan ini kami menyampaikan bahwa yang bersangkutan mengajukan [[jenis cuti]] selama [[lama cuti]] hari kerja, terhitung mulai [[tanggal mulai]] sampai dengan [[tanggal selesai]], karena [[alasan]].\n\nKegiatan pembelajaran selama cuti akan diatur oleh pihak sekolah. Mohon kiranya dapat diproses sebagaimana mestinya.\n\nDemikian surat ini kami sampaikan, atas perhatian dan kerja samanya kami ucapkan terima kasih."},{"key":"03 Kepegawaian · Pengantar Usul Pangkat/KGB","k":"800.1.3.2","p":"Usul [[Kenaikan Pangkat/Kenaikan Gaji Berkala]] a.n. [[nama]]","t":"[[Kepala Cabang Dinas/Dinas Pendidikan]]","isi":"Dengan hormat,\n\nBersama ini kami sampaikan berkas usul [[kenaikan pangkat/kenaikan gaji berkala]] atas nama [[nama]], NIP [[NIP]], [[jabatan]] pada {sekolah}, dengan kelengkapan berkas sebagaimana terlampir.\n\nMohon kiranya usulan tersebut dapat diproses sesuai ketentuan yang berlaku.\n\nDemikian surat ini kami sampaikan, atas perhatian dan kerja samanya kami ucapkan terima kasih."},{"key":"03 Kepegawaian · Rekomendasi Guru/Tendik","k":"400.3.5.10","p":"Rekomendasi Guru/Tenaga Kependidikan","t":"[[Pihak yang dituju]]","isi":"Yang bertanda tangan di bawah ini, Kepala {sekolah}, menerangkan bahwa:\n\nnama : [[nama]]\nnip : [[NIP]]\njabatan : [[jabatan]]\n\nadalah guru/tenaga kependidikan di {sekolah} yang berdedikasi, disiplin, dan bertanggung jawab, serta kami rekomendasikan untuk [[tujuan rekomendasi]].\n\nDemikian surat rekomendasi ini dibuat untuk dipergunakan sebagaimana mestinya.","ti":"SURAT REKOMENDASI","sub":false},{"key":"04 Kegiatan & Kesiswaan · Undangan Kegiatan untuk Wali Murid","k":"400.3.5.02","p":"Undangan [[nama kegiatan]]","t":"Orang tua/wali peserta didik {sekolah}","isi":"Dengan hormat,\n\nDalam rangka [[nama kegiatan]] di {sekolah}, kami mengundang Bapak/Ibu orang tua/wali peserta didik untuk hadir pada:\n\nhari, tanggal : [[hari, tanggal]]\npukul : [[pukul]] WIB s.d. selesai\ntempat : [[tempat]]\nacara : [[acara]]\n\nMengingat pentingnya acara tersebut, kami mohon kehadiran Bapak/Ibu tepat waktu.\n\nDemikian undangan ini kami sampaikan, atas perhatian dan kehadirannya kami ucapkan terima kasih."},{"key":"04 Kegiatan & Kesiswaan · Pemberitahuan Kegiatan kepada Wali Murid","k":"400.3.5.02","p":"Pemberitahuan [[nama kegiatan]]","t":"Orang tua/wali peserta didik {sekolah}","isi":"Dengan hormat,\n\nSehubungan dengan program sekolah, kami memberitahukan bahwa {sekolah} akan melaksanakan [[nama kegiatan]] pada [[hari, tanggal]] bertempat di [[tempat]].\n\nPeserta didik diharapkan [[ketentuan/perlengkapan yang harus dibawa]]. Kami mohon dukungan Bapak/Ibu agar kegiatan berjalan lancar.\n\nDemikian surat ini kami sampaikan, atas perhatian dan kerja samanya kami ucapkan terima kasih."},{"key":"04 Kegiatan & Kesiswaan · Permohonan Izin Kegiatan","k":"400.3.5.03","p":"Permohonan Izin [[nama kegiatan]]","t":"[[Pihak yang dituju]]","isi":"Dengan hormat,\n\nDalam rangka [[tujuan kegiatan]], {sekolah} bermaksud melaksanakan [[nama kegiatan]] pada [[hari, tanggal]] bertempat di [[tempat]] dengan peserta [[jumlah]] peserta didik dan [[jumlah]] pendamping.\n\nSehubungan dengan itu, kami mohon izin dan dukungan Bapak/Ibu agar kegiatan tersebut dapat terlaksana dengan baik.\n\nDemikian surat ini kami sampaikan, atas perhatian dan kerja samanya kami ucapkan terima kasih."},{"key":"04 Kegiatan & Kesiswaan · Pengantar Pendaftaran Lomba","k":"400.3.5.4","p":"Pendaftaran Peserta [[nama lomba]]","t":"Panitia [[nama lomba]]","isi":"Dengan hormat,\n\nMenindaklanjuti informasi pelaksanaan [[nama lomba]], dengan ini kami mendaftarkan peserta didik {sekolah} sebagai berikut:\n\n1. [[nama peserta 1]] - [[cabang lomba]]\n2. [[nama peserta 2]] - [[cabang lomba]]\n\nKami mohon peserta tersebut dapat diterima dan diikutsertakan dalam kegiatan dimaksud.\n\nDemikian surat ini kami sampaikan, atas perhatian dan kerja samanya kami ucapkan terima kasih."},{"key":"05 Sarana Prasarana · Permohonan Bantuan Sarpras","k":"400.3.13.1","p":"Permohonan Bantuan [[perbaikan/pengadaan sarana prasarana]]","t":"[[Pihak yang dituju]]","isi":"Dengan hormat,\n\n{sekolah} saat ini memiliki kondisi [[uraian kondisi sarana/prasarana]] yang mengganggu kegiatan pembelajaran.\n\nUntuk itu kami mohon bantuan [[perbaikan/pengadaan]] berupa [[jenis barang/bangunan]] sebanyak [[jumlah]]. Data pendukung dan foto kondisi terlampir.\n\nDemikian surat ini kami sampaikan, atas perhatian dan kerja samanya kami ucapkan terima kasih."},{"key":"05 Sarana Prasarana · Peminjaman Barang/Fasilitas","k":"000.1.4","p":"Peminjaman [[nama barang/fasilitas]]","t":"[[Pihak yang dituju]]","isi":"Dengan hormat,\n\nSehubungan dengan [[nama kegiatan]] yang akan dilaksanakan pada [[hari, tanggal]], kami bermaksud meminjam [[nama barang/fasilitas]] sebanyak [[jumlah]].\n\nKami bertanggung jawab atas keamanan dan akan mengembalikan dalam kondisi baik setelah kegiatan selesai.\n\nDemikian surat ini kami sampaikan, atas perhatian dan kerja samanya kami ucapkan terima kasih."},{"key":"05 Sarana Prasarana · Pemberitahuan Penggunaan Fasilitas Sekolah","k":"000.1.4","p":"Penggunaan Fasilitas {sekolah}","t":"[[Pihak yang dituju]]","isi":"Dengan hormat,\n\nMenanggapi permohonan Saudara, dengan ini kami memberikan izin penggunaan [[nama fasilitas]] {sekolah} pada [[hari, tanggal]] pukul [[pukul]] WIB untuk [[keperluan]].\n\nPengguna wajib menjaga kebersihan, ketertiban, dan keutuhan fasilitas selama penggunaan.\n\nDemikian surat ini kami sampaikan, atas perhatian dan kerja samanya kami ucapkan terima kasih."},{"key":"05 Sarana Prasarana · Usulan Penghapusan Barang","k":"000.2.4","p":"Usulan Penghapusan Barang Milik Daerah","t":"[[Pihak yang dituju]]","isi":"Dengan hormat,\n\nBerdasarkan hasil inventarisasi, terdapat barang milik daerah di {sekolah} yang rusak berat/tidak dapat dimanfaatkan lagi, yaitu [[nama barang]] sebanyak [[jumlah]] dengan kode barang [[kode barang]].\n\nSehubungan dengan itu kami mengusulkan penghapusan barang tersebut sesuai ketentuan. Berita acara kondisi barang terlampir.\n\nDemikian surat ini kami sampaikan, atas perhatian dan kerja samanya kami ucapkan terima kasih."},{"key":"06 Keuangan & Bantuan · Permohonan Pencairan Dana","k":"400.3.5.2","p":"Permohonan Pencairan [[nama dana/bantuan]] Tahap [[tahap]]","t":"[[Pihak yang dituju]]","isi":"Dengan hormat,\n\nSehubungan dengan program [[nama dana/bantuan]] Tahun Anggaran {tp}, dengan ini kami mengajukan permohonan pencairan dana tahap [[tahap]] sebesar Rp[[nominal]] ([[terbilang]]) untuk {sekolah}.\n\nBerkas persyaratan terlampir. Atas perhatian dan bantuannya kami ucapkan terima kasih."},{"key":"06 Keuangan & Bantuan · Pengantar LPJ BOS","k":"400.3.5.5","p":"Penyampaian Laporan Pertanggungjawaban BOS Tahap [[tahap]]","t":"[[Pihak yang dituju]]","isi":"Dengan hormat,\n\nBersama ini kami sampaikan Laporan Pertanggungjawaban Penggunaan Dana BOS Tahap [[tahap]] Tahun {tp} {sekolah}, dengan total penggunaan Rp[[nominal]], beserta bukti pendukung sebagaimana terlampir.\n\nMohon kiranya laporan tersebut dapat diterima dan diverifikasi.\n\nDemikian surat ini kami sampaikan, atas perhatian dan kerja samanya kami ucapkan terima kasih."},{"key":"06 Keuangan & Bantuan · Pernyataan Tanggung Jawab Mutlak","k":"900.1.3.6","p":"Tanggung Jawab Mutlak [[nama dana]]","t":"Yang bersangkutan","isi":"Yang bertanda tangan di bawah ini:\n\nnama : {kepsek}\nnip : {nip}\njabatan : Kepala {sekolah}\n\nmenyatakan bahwa seluruh penggunaan dana [[nama dana]] sebesar Rp[[nominal]] periode [[periode]] telah dibelanjakan sesuai peruntukan dan ketentuan yang berlaku, serta bukti-bukti pengeluarannya disimpan dengan baik dan siap diperiksa.\n\nApabila di kemudian hari terdapat ketidaksesuaian, saya bersedia bertanggung jawab sesuai peraturan perundang-undangan.\n\nDemikian surat pernyataan ini dibuat dengan sebenarnya.","ti":"SURAT PERNYATAAN TANGGUNG JAWAB MUTLAK","sub":false},{"key":"06 Keuangan & Bantuan · Pemberitahuan Bantuan Peserta Didik","k":"400.3.5.6","p":"Penyaluran Bantuan [[nama bantuan]]","t":"Orang tua/wali [[nama peserta didik]]","isi":"Dengan hormat,\n\nKami memberitahukan bahwa putra/putri Bapak/Ibu, [[nama peserta didik]], tercatat sebagai penerima [[nama bantuan]] Tahun {tp}.\n\nMohon Bapak/Ibu hadir ke sekolah pada [[hari, tanggal]] dengan membawa [[dokumen yang diperlukan]] untuk proses penyaluran bantuan.\n\nDemikian surat ini kami sampaikan, atas perhatian dan kerja samanya kami ucapkan terima kasih."},{"key":"07 Kemitraan & Humas · Permohonan Kerja Sama","k":"400.14.5.2","p":"Permohonan Kerja Sama [[bidang kerja sama]]","t":"[[Mitra yang dituju]]","isi":"Dengan hormat,\n\n{sekolah} berupaya meningkatkan mutu layanan pendidikan melalui kemitraan dengan berbagai pihak. Sehubungan dengan itu, kami mengajukan permohonan kerja sama dalam bidang [[bidang kerja sama]] dengan bentuk [[bentuk kerja sama]].\n\nKami bersedia menjelaskan lebih lanjut pada waktu yang Bapak/Ibu tentukan.\n\nDemikian surat ini kami sampaikan, atas perhatian dan kerja samanya kami ucapkan terima kasih."},{"key":"07 Kemitraan & Humas · Undangan Komite/Tokoh Masyarakat","k":"400.14.5.2","p":"Undangan [[nama kegiatan]]","t":"[[Nama/jabatan yang diundang]]","isi":"Dengan hormat,\n\nDalam rangka [[nama kegiatan]], kami mengundang Bapak/Ibu sebagai pengurus komite/tokoh masyarakat untuk hadir pada:\n\nhari, tanggal : [[hari, tanggal]]\npukul : [[pukul]] WIB s.d. selesai\ntempat : [[tempat]]\nacara : [[acara]]\n\nMengingat pentingnya acara tersebut, kami mohon kehadiran Bapak/Ibu tepat waktu.\n\nDemikian undangan ini kami sampaikan, atas perhatian dan kehadirannya kami ucapkan terima kasih."},{"key":"07 Kemitraan & Humas · Ucapan Terima Kasih","k":"400.14.5.2","p":"Ucapan Terima Kasih","t":"[[Pihak yang dituju]]","isi":"Dengan hormat,\n\nAtas nama {sekolah}, kami mengucapkan terima kasih yang sebesar-besarnya atas [[bantuan/dukungan yang diberikan]] pada [[hari, tanggal]].\n\nBantuan tersebut sangat bermanfaat bagi [[manfaat]]. Semoga kebaikan Bapak/Ibu mendapat balasan yang berlipat ganda."},{"key":"07 Kemitraan & Humas · Permohonan Narasumber","k":"400.14.5.4","p":"Permohonan Narasumber [[nama kegiatan]]","t":"[[Nama/jabatan narasumber]]","isi":"Dengan hormat,\n\nDalam rangka [[nama kegiatan]] di {sekolah}, kami memohon kesediaan Bapak/Ibu sebagai narasumber/pemateri tentang [[topik]] pada:\n\nhari, tanggal : [[hari, tanggal]]\npukul : [[pukul]] WIB\ntempat : [[tempat]]\n\nDemikian surat ini kami sampaikan, atas perhatian dan kerja samanya kami ucapkan terima kasih."},{"key":"08 Evaluasi & Mutu · Pemberitahuan Supervisi","k":"400.3.7","p":"Pemberitahuan Supervisi [[akademik/manajerial]]","t":"[[Guru/tenaga kependidikan yang disupervisi]]","isi":"Dengan hormat,\n\nDalam rangka pembinaan dan peningkatan mutu pembelajaran, kami memberitahukan bahwa supervisi [[akademik/manajerial]] akan dilaksanakan pada:\n\nhari, tanggal : [[hari, tanggal]]\nwaktu : [[jam pelajaran/pukul]]\ntempat : [[kelas/ruang]]\n\nBapak/Ibu diminta menyiapkan perangkat pembelajaran dan dokumen pendukung lainnya.\n\nDemikian disampaikan untuk dilaksanakan sebagaimana mestinya."},{"key":"08 Evaluasi & Mutu · Undangan Rapat Evaluasi/Mutu","k":"400.3.5.02","p":"Undangan Rapat Evaluasi [[semester/kegiatan]]","t":"Seluru function cleanOp(o){if(!o||!o.oid||!o.ref||!o.perihal||!o.kode||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(String(o.tgl)))return null;function t(v,n){return String(v==null?'':v).slice(0,n)}return {oid:t(o.oid,120),ref:t(o.ref,120),no:+o.no||0,tgl:t(o.tgl,10),kode:t(o.kode,40),tujuan:t(o.tujuan,300),perihal:t(o.perihal,300),isi:t(o.isi,1500),src:'Notula Digital'}}

function doPost(e){
  var lock=LockService.getScriptLock();
  try{
    lock.waitLock(20000);
    var d=JSON.parse(e.postData.contents);
    var ntl=tokenNtlOk(d.token);
    if(d.token!==TOKEN&&!(ntl&&d.action==='inbox'))return out({ok:false,error:'Token tidak cocok'});
    var ss=SpreadsheetApp.getActiveSpreadsheet();
    if(d.action==='inbox'){
      var add=(d.ops||[]).slice(0,20).map(cleanOp).filter(Boolean);
      if(add.length){
        var cur=inboxList(ss).filter(function(x){return !add.some(function(a){return a.ref===x.ref})});
        inboxSave(ss,cur.concat(add));bump();
      }
      return out({ok:true,n:add.length});
    }
    if(d.action==='sync'){
      if(d.ack&&d.ack.length)inboxSave(ss,inboxList(ss).filter(function(x){return d.ack.indexOf(x.oid)<0}));
      var m=mergeAll(bacaMaster(ss),d.state);
      saveBackup(ss,JSON.stringify(m));
      var v=String(Date.now());PropertiesService.getScriptProperties().setProperty('ver',v);
      return out({ok:true,state:m,ver:v,inbox:inboxList(ss)});
    }
    put(ss,'Surat Masuk',d.masuk);
    put(ss,'Surat Keluar',d.keluar);
    put(ss,'Disposisi',d.disp);
    if(!d.tabel)saveBackup(ss,d.backup||'');
    ringkasan(ss);
    catat(ss,d);
    return out({ok:true});
  }catch(err){
    return out({ok:false,error:String(err)});
  }finally{
    lock.releaseLock();
  }
}

function doGet(e){
  var cb=e&&e.parameter&&e.parameter.callback;
  if(cb&&!/^[A-Za-z0-9_]+$/.test(cb))cb='';
  try{
    var tk=(e&&e.parameter)?e.parameter.token:'';
    if(e&&e.parameter&&e.parameter.nomor&&(tk===TOKEN||tokenNtlOk(tk))){
      var ss0=SpreadsheetApp.getActiveSpreadsheet(),ms=bacaMaster(ss0);
      if(!ms.set)return kirim({ok:false,error:'SIPAS belum pernah sinkron ke Sheet. Buka SIPAS dulu.'},cb);
      return kirim({ok:true,v:versi(),keluar:(ms.keluar||[]).map(function(k){return {no:k.no,tgl:k.tgl,nomor:k.nomor,ref:k.ref||'',src:k.src||''}}),set:{fmt:ms.set.fmt,unit:ms.set.unit},ops:inboxList(ss0)},cb);
    }
    if(!e||!e.parameter||tk!==TOKEN)return kirim({ok:false,error:'Token tidak cocok'},cb);
    if(e.parameter.cek)return kirim({ok:true,v:versi()},cb);
    var b=SpreadsheetApp.getActiveSpreadsheet().getSheetByName('_backup');
    var s='';
    if(b&&b.getLastRow()>0){
      s=b.getRange(1,1,b.getLastRow(),1).getValues().map(function(r){return r[0]}).join('');
    }
    return kirim({ok:true,backup:s,v:versi(),inbox:inboxList(SpreadsheetApp.getActiveSpreadsheet())},cb);
  }catch(err){
    return kirim({ok:false,error:String(err)},cb);
  }
}

  for(var m=1;m<=12;m++){
